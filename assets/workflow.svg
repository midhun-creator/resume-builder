<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" width="1200" height="376" role="img" aria-label="The ResumeCraft wizard: register, personal details, education, experience, skills, projects, review and export"><title>The ResumeCraft wizard: register, personal details, education, experience, skills, projects, review and export</title><desc>Animated flow showing the seven steps of the wizard with a glowing dot travelling along them while a completion bar climbs 33, 66 and 100 percent.</desc><defs>
<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
