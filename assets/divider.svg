<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" aria-label=""><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-500%" width="200%" height="1100%"><feGaussianBlur stdDeviation="4"/></filter><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}
.blink{animation:blink 1.05s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.anim{animation:none!important}}
</style></defs><rect x="0" y="17" width="1200" height="2" fill="url(#gb)"/><rect y="16" width="320" height="4" rx="2" fill="url(#gl)" filter="url(#glow)"><animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;1" values="-320;1200" /></rect><rect y="17" width="320" height="2" rx="1" fill="url(#gl)"><animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;1" values="-320;1200" /></rect><g transform="translate(600 18)"><rect class="anim" x="-5" y="-5" width="10" height="10" rx="2" fill="#7c3aed" transform="rotate(45)" style="animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center"/></g></svg>