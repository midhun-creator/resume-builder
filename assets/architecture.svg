<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="ResumeCraft architecture: browser, URL router, views, then forms and models, the PDF preview, or the DOCX builder"><title>ResumeCraft architecture: browser, URL router, views, then forms and models, the PDF preview, or the DOCX builder</title><desc>Animated request flow. Packets travel from the browser through urls.py and views.py to the database layer, the print-ready preview, and the DOCX generator, then return as a response.</desc><defs>
