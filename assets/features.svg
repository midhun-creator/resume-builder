<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="ResumeCraft features: professional design, guided wizard, ATS-friendly, DOCX and PDF export, private by default, live completion meter"><title>ResumeCraft features: professional design, guided wizard, ATS-friendly, DOCX and PDF export, private by default, live completion meter</title><defs><clipPath id="card"><rect width="1200" height="480" rx="24"/></clipPath><radialGradient id="bgGlow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#1a0b2e" stop-opacity=".9"/><stop offset="1" stop-color="#08080f"/></radialGradient><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}
.blink{animation:blink 1.05s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.anim{animation:none!important}}
.ic{animation:float 5s ease-in-out infinite}</style></defs><g clip-path="url(#card)"><rect width="1200" height="480" fill="#08080f"/><rect width="1200" height="480" fill="url(#bgGlow)"/><g transform="translate(24 24)"><rect width="368" height="208" rx="20" fill="#0f0f1a" stroke="#fff" stroke-opacity=".09"/><rect width="368" height="208" rx="20" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.041;0.083;0.183;0.242;1" values="0;0;1;1;0;0" /></rect><g transform="translate(60 64)"><g class="ic anim" style="animation-delay:0.0s"><circle r="34" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".55" stroke-width="1.5"/><path d="M0-13L3.8-3.8 13 0 3.8 3.8 0 13-3.8 3.8-13 0-3.8-3.8Z" fill="#7c3aed" stroke="none"/></g></g><text x="112" y="72" class="sans" font-size="22" font-weight="800" fill="#f1f5f9">Professional design</text><text x="32" y="132" class="sans" font-size="16" fill="#94a3b8">Clean, modern A4 layout that looks</text><text x="32" y="158" class="sans" font-size="16" fill="#94a3b8">sharp on screen and prints flawlessly.</text></g><g transform="translate(416 24)"><rect width="368" height="208" rx="20" fill="#0f0f1a" stroke="#fff" stroke-opacity=".09"/><rect width="368" height="208" rx="20" fill="#f59e0b" fill-opacity=".07" stroke="#f59e0b" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.199;0.242;0.342;0.4;1" values="0;0;1;1;0;0" /></rect><g transform="translate(60 64)"><g class="ic anim" style="animation-delay:0.4s"><circle r="34" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".55" stroke-width="1.5"/><path d="M3-14L-9 3H-1L-4 14 9-3H1Z" fill="#f59e0b" stroke="none"/></g></g><text x="112" y="72" class="sans" font-size="22" font-weight="800" fill="#f1f5f9">Guided wizard</text><text x="32" y="132" class="sans" font-size="16" fill="#94a3b8">Step by step: personal, education,</text><text x="32" y="158" class="sans" font-size="16" fill="#94a3b8">experience, skills, then projects.</text></g><g transform="translate(808 24)"><rect width="368" height="208" rx="20" fill="#0f0f1a" stroke="#fff" stroke-opacity=".09"/><rect width="368" height="208" rx="20" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.357;0.4;0.5;0.558;1" values="0;0;1;1;0;0" /></rect><g transform="translate(60 64)"><g class="ic anim" style="animation-delay:0.8s"><circle r="34" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-opacity=".55" stroke-width="1.5"/><path d="M-10 1L-3.5 8 10-8" fill="none" stroke="#10b981" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="112" y="72" class="sans" font-size="22" font-weight="800" fill="#f1f5f9">ATS-friendly</text><text x="32" y="132" class="sans" font-size="16" fill="#94a3b8">Standard section headings and a clean</text><text x="32" y="158" class="sans" font-size="16" fill="#94a3b8">structure that tracking systems can read.</text></g><g transform="translate(24 256)"><rect width="368" height="208" rx="20" fill="#0f0f1a" stroke="#fff" stroke-opacity=".09"/><rect width="368" height="208" rx="20" fill="#3b82f6" fill-opacity=".07" stroke="#3b82f6" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.516;0.558;0.658;0.717;1" values="0;0;1;1;0;0" /></rect><g transform="translate(60 64)"><g class="ic anim" style="animation-delay:1.2000000000000002s"><circle r="34" fill="#3b82f6" fill-opacity=".14" stroke="#3b82f6" stroke-opacity=".55" stroke-width="1.5"/><path d="M0-12V6M-8 -2L0 6 8-2M-10 13H10" fill="none" stroke="#3b82f6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="112" y="72" class="sans" font-size="22" font-weight="800" fill="#f1f5f9">DOCX + PDF export</text><text x="32" y="132" class="sans" font-size="16" fill="#94a3b8">Editable Word file built from raw Open</text><text x="32" y="158" class="sans" font-size="16" fill="#94a3b8">XML, or a print-ready PDF in one click.</text></g><g transform="translate(416 256)"><rect width="368" height="208" rx="20" fill="#0f0f1a" stroke="#fff" stroke-opacity=".09"/><rect width="368" height="208" rx="20" fill="#ec4899" fill-opacity=".07" stroke="#ec4899" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.674;0.717;0.817;0.875;1" values="0;0;1;1;0;0" /></rect><g transform="translate(60 64)"><g class="ic anim" style="animation-delay:1.6s"><circle r="34" fill="#ec4899" fill-opacity=".14" stroke="#ec4899" stroke-opacity=".55" stroke-width="1.5"/><rect x="-9" y="-2" width="18" height="14" rx="3" fill="#ec4899" stroke="none"/><path d="M-5.5-2v-4.5a5.5 5.5 0 0 1 11 0V-2" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/></g></g><text x="112" y="72" class="sans" font-size="22" font-weight="800" fill="#f1f5f9">Private by default</text><text x="32" y="132" class="sans" font-size="16" fill="#94a3b8">Every edit and delete is scoped to the</text><text x="32" y="158" class="sans" font-size="16" fill="#94a3b8">logged-in owner, never other accounts.</text></g><g transform="translate(808 256)"><rect width="368" height="208" rx="20" fill="#0f0f1a" stroke="#fff" stroke-opacity=".09"/><rect width="368" height="208" rx="20" fill="#a78bfa" fill-opacity=".07" stroke="#a78bfa" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.833;0.875;0.975;1" values="0;0;1;1;0" /></rect><g transform="translate(60 64)"><g class="ic anim" style="animation-delay:2.0s"><circle r="34" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.5"/><circle r="10" fill="none" stroke="#a78bfa" stroke-opacity=".3" stroke-width="3.4"/><circle r="10" fill="none" stroke="#a78bfa" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="42 63" transform="rotate(-90)"/></g></g><text x="112" y="72" class="sans" font-size="22" font-weight="800" fill="#f1f5f9">Live completion meter</text><text x="32" y="132" class="sans" font-size="16" fill="#94a3b8">Tracks contact info, education and</text><text x="32" y="158" class="sans" font-size="16" fill="#94a3b8">skills, so you know when you’re ready.</text></g></g></svg>