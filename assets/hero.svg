<radialGradient id="bgGlow" cx=".5" cy="0" r=".95"><stop offset="0" stop-color="#1e0a32" stop-opacity=".9"/><stop offset="1" stop-color="#08080f"/></radialGradient>
<radialGradient id="gridFade" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gridMask"><rect width="1200" height="480" fill="url(#gridFade)"/></mask>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="card"><rect width="1200" height="480" rx="28"/></clipPath>
