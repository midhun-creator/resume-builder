<linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9d5ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
