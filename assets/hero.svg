.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}
.blink{animation:blink 1.05s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.anim{animation:none!important}}

@keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,50px)}}
@keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-40px)}}
@keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-60px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-520px);opacity:0}}
@keyframes glowp{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes draw{0%{transform:scaleX(0)}9%{transform:scaleX(1)}82%{transform:scaleX(1)}92%,100%{transform:scaleX(0)}}
@keyframes ringp{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:0}}
.oA{animation:driftA 14s ease-in-out infinite}
.oB{animation:driftB 17s ease-in-out infinite}
.oC{animation:driftC 12s ease-in-out infinite}
.p{animation:rise 9s linear infinite}
.fl1{animation:float 5.5s ease-in-out infinite}
.fl2{animation:floatb 6.5s ease-in-out infinite}
.fl3{animation:float 7s ease-in-out infinite}
.glow{animation:glowp 3.4s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left center;animation:draw 8s ease-in-out infinite both}
.dot{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style></defs><g clip-path="url(#card)">
